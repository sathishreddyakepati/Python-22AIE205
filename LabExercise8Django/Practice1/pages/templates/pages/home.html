{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{% static 'pages/style.css' %}">
    <meta charset="UTF-8">
    <title>My Website</title>
</head>

<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>

    </nav>

    <h1>Welcome to My Website</h1>

    <p>Hello! My name is {{ student_name }}. I am learning Django.</p>
    <h2>My Skills</h2>

    <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>
</body>

</html>
